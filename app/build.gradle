plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

// Stripe publishable key from local.properties (not committed). Empty when
// missing, which disables card payments in the app.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def stripePublishableKey = localProps.getProperty('STRIPE_PUBLISHABLE_KEY', '')

android {
    namespace 'com.example.qless'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.qless"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "STRIPE_PUBLISHABLE_KEY", "\"${stripePublishableKey}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    
    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.firebase.functions
    
    // Google Sign-In
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.googleid
    
    // Location
    implementation libs.play.services.location
    
    // UI
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.glide
    
    // Payment - Stripe
    implementation libs.stripe.android
    
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}