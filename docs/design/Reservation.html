<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7F5; color: #1C1C22; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; align-items: center; text-align: center">

    <div style="width: 100%; height: 4px; border-radius: 4px; background: #EFEEEA; margin-top: 10px">

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4F52B8","options":["#4F52B8","#2F6F6A","#3B3B44","#7A4E9E"]},"$preview":{"width":390,"height":844}}'>

  }
}
</script>
